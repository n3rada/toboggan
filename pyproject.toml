[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[project]
name = "toboggan"
version = "0.9.3"
description = "Upgrade any RCE primitive to a semi-interactive session, with an mkfifo forward shell for filtered-egress targets and modular post-exploitation actions."
authors = [
    { name = "n3rada", email = "72791564+n3rada@users.noreply.github.com" }
]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.11,<4.0"

keywords = [
    "post-exploitation", "web-shell", "rce", "command-injection", "blind-rce",
    "forward-shell", "reverse-shell", "mkfifo", "named-pipe",
    "semi-interactive-shell", "red-team", "pentesting", "offensive-security",
    "privilege-escalation", "shell-upgrade", "obfuscation", "ctf",
    "security-research", "authorized-testing", "imds", "aws-metadata",
    "python", "linux", "windows",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Shells",
    "Topic :: System :: Networking",
]

dependencies = [
    "cryptography>=48.0.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "modwrap>=1.1.7",
    "prompt-toolkit>=3.0.52",
    "pycryptodomex>=3.23.0",
    "tqdm>=4.67.3",
]

[project.urls]
repository = "https://github.com/n3rada/toboggan"
homepage = "https://github.com/n3rada/toboggan"
documentation = "https://github.com/n3rada/toboggan/blob/main/README.md"
issues = "https://github.com/n3rada/toboggan/issues"

[project.scripts]
toboggan = "toboggan.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Ruff: linter and formatter
# Enforces the rules in AGENTS.md and DEVELOPMENT.md mechanically.

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",      # pyflakes: unused imports, undefined names
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort: import ordering
    "N",      # pep8-naming: snake_case, PascalCase, SCREAMING_SNAKE
    "UP",     # pyupgrade: modern Python 3.11+ syntax
    "D",      # pydocstyle: docstring presence and style
    "FA",     # flake8-future-annotations: enforce from __future__ import annotations
    "TCH",    # flake8-type-checking: move type-only imports behind TYPE_CHECKING
    "RUF",    # ruff-specific rules
]
ignore = [
    "D100",   # module docstring: not every module needs one
    "D104",   # package __init__.py docstring
    "D105",   # magic method docstring
    "D107",   # __init__ docstring: class docstring covers it when simple
    "E501",   # line length: handled by the formatter, not the linter
]

[tool.ruff.lint.isort]
known-first-party = ["toboggan"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
lines-between-types = 0

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",      # docstrings not enforced in tests
    "FA100",  # future annotations not enforced in tests
]
"src/toboggan/core/terminal.py" = [
    "N806",   # ANSI color constants (BOLD, GREEN, etc.) are intentionally uppercase inside functions
]
